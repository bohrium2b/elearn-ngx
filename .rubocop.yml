plugins:
  - rubocop-rails
  - rubocop-performance

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - "db/schema.rb"
    - "db/migrate/**/*"
    - "bin/**/*"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "public/mathjax/**/*"

# ── Layout ────────────────────────────────────────────────────────────────────
Layout/LineLength:
  Max: 140
  AllowedPatterns:
    - "^\\s*#" # comments

# ── Style ─────────────────────────────────────────────────────────────────────
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

# ── Metrics ───────────────────────────────────────────────────────────────────
Metrics/MethodLength:
  Max: 25

Metrics/ClassLength:
  Max: 200
  Exclude:
    - "test/**/*"

Metrics/BlockLength:
  AllowedMethods:
    - describe
    - context
    - it
    - let
    - before
    - after
    - routes.draw
    - configure
    - factory
  Max: 30
  Exclude:
    - "config/routes.rb"
    - "test/factories/**/*"

Metrics/AbcSize:
  Max: 35

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 14

# ── Rails ─────────────────────────────────────────────────────────────────────
Rails/Output:
  Enabled: true

Rails/HasAndBelongsToMany:
  Enabled: false

Rails/UniqueValidationWithoutIndex:
  Enabled: false

Rails/I18nLocaleTexts:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Style/MultilineBlockChain:
  Enabled: false

Style/HashLikeCase:
  Enabled: false

Lint/UnderscorePrefixedVariableName:
  Enabled: false

Lint/IneffectiveAccessModifier:
  Enabled: false
